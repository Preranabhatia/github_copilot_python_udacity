<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Game</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div id="theme-toggle-container">
    <button id="theme-toggle" aria-label="Toggle Dark Mode" title="Toggle Dark Mode">
      <span class="theme-icon">🌙</span>
    </button>
  </div>
  <h1>Sudoku Game</h1>
  <div id="timer-display">Time: 0:00</div>
  <div class="difficulty-selector">
    <label>Difficulty:</label>
    <button class="difficulty-btn" data-difficulty="easy">Easy</button>
    <button class="difficulty-btn active" data-difficulty="medium">Medium</button>
    <button class="difficulty-btn" data-difficulty="hard">Hard</button>
  </div>
  <div id="sudoku-board"></div>
  <div class="controls">
    <button id="new-game">New Game</button>
    <button id="hint">Hint</button>
    <button id="check-puzzle">Check Puzzle</button>
    <button id="check-solution">Check Solution</button>
    <span id="message"></span>
  </div>
  <div id="hint-counter">Hints Used: 0</div>
  
  <div id="leaderboard-section">
    <h2>Top 10 Scores</h2>
    <table id="leaderboard">
      <thead>
        <tr>
          <th>Rank</th>
          <th>Player</th>
          <th>Time</th>
          <th>Hints</th>
          <th>Difficulty</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body">
        <tr><td colspan="5">No scores yet. Complete a puzzle to join the leaderboard!</td></tr>
      </tbody>
    </table>
  </div>
  
  <div id="name-modal" class="modal">
    <div class="modal-content">
      <h3>Great Job!</h3>
      <p>Enter your name to save your score:</p>
      <input type="text" id="player-name-input" placeholder="Enter your name" maxlength="20">
      <div class="modal-buttons">
        <button id="save-score-btn">Save Score</button>
        <button id="skip-score-btn">Skip</button>
      </div>
    </div>
  </div>
  <script src="/static/main.js"></script>
</body>
</html>
